# This manifest is not deployed. It is just used for validating crossplane compositions using
# crossplane render --extra-resources environmentconfig-example.yaml ...
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: eks-environment
data:
  cloud: "aws"
  clusterName: "mycluster-0"
  oidcUrl: "https://oidc.eks.eu-west-3.amazonaws.com/id/foobar"
  oidcHost: "oidc.eks.eu-west-3.amazonaws.com"
  oidcArn: "arn:aws:iam::123456789012:oidc-provider/oidc.eks.eu-west-3.amazonaws.com/id/foobar"
  accountId: "123456789012"
  region: "eu-west-3"
  vpcId: "vpc-0"
  CIDRBlock: "10.0.0.0/16"
  privateSubnetIds: "subnet-0,subnet-1,subnet-2"
  # priv.aws.ogenki.io, matching the LIVE aws-0 EnvironmentConfig. It said
  # priv.cloud.ogenki.io until now -- the pre-ADR-0017 name -- which meant the
  # golden fixtures agreed with a hardcoded literal in the App Composition
  # instead of with the cluster. The two were consistently wrong together, so
  # render equivalence passed while every routed App on aws-0 sat Ready=False.
  privateDomainName: "priv.aws.ogenki.io"
---
# The GCP counterpart, read by the GCPWorkloadIdentity Composition.
#
# projectNumber is deliberately UNQUOTED, so the fixture matches what Flux
# actually produces. Full explanation in apis/gcpworkloadidentity/kcl/main.k,
# at _projectNumber.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: gke-environment
data:
  cloud: "gcp"
  clusterName: "gcp-mycluster-0"
  projectID: "ogenki-435905"
  projectNumber: 323586397743
  workloadPool: "ogenki-435905.svc.id.goog"
  region: "europe-west4"
  zone: "europe-west4-a"
  networkName: "vpc-mycluster-0"
  privateDomainName: "priv.gcp.ogenki.io"
