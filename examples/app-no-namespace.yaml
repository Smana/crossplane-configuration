---
# An App claim with NO metadata.namespace — the path that crashed the Composition.
#
# This example exists because its absence hid a real bug, the same way
# app-private-route.yaml does. Every other example sets a namespace, so
# `_namespace = oxr.metadata.namespace` was never Undefined in any fixture, and
# the unguarded `_namespace.startswith("preview-")` in the route block rendered
# green forever:
#
#   prog.k:964:1  _isPreview = _namespace.startswith("preview-")
#                 invalid value 'UndefinedType' to load attribute 'startswith'
#
# A claim applied to a cluster always has a namespace — the API server defaults
# it. `crossplane render` does not, and that is the caller that broke: the App
# Wizard's render preview builds a claim with no namespace when no stack is
# selected yet, so clicking Preview returned this fatal instead of resources.
#
# The route block is what makes this reachable: the failing line sits inside
# `if oxr.spec.route?.enabled == True and _isWeb:`, so a namespace-less claim
# WITHOUT a route renders fine. Keep route.enabled here, or this fixture stops
# covering the line it was written for.
apiVersion: cloud.ogenki.io/v1alpha1
kind: App
metadata:
  name: no-namespace-app
spec:
  image:
    repository: ghcr.io/example/no-namespace-app
    tag: "v1.0.0"
  service:
    port: 8080
  route:
    enabled: true
    hostname: "no-namespace-app"
