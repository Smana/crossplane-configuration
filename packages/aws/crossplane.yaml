apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-configuration-aws
  annotations:
    meta.crossplane.io/maintainer: Smana <smaine.kahlouch@ogenki.io>
    meta.crossplane.io/source: github.com/Smana/crossplane-configuration
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      AWS implementations of the ogenki platform APIs: the EPI (EKS Pod Identity)
      contract and Compositions, and the AWS Compositions for App, SQLInstance
      and InferenceService.
spec:
  crossplane:
    version: ">=v2.0.0-0"
  dependsOn:
    # Floor raised from >=v0.1.0 for the objectStore migration. The App
    # Composition here reads `oxr.spec.objectStore`, a field that exists only
    # in core v0.3.0's XRD. A cluster already running core v0.2.0 satisfies
    # >=v0.1.0, so Crossplane would leave it in place and this Composition
    # would render against an XRD that still defines s3Bucket -- claims
    # rejected, with nothing naming the version skew as the cause.
    - configuration: ghcr.io/smana/crossplane-configuration-core
      version: ">=v0.3.0"
    # NO function dependsOn — deliberately. See Smana/cloud-native-ref#1971 and
    # the longer note in packages/core/crossplane.yaml. Declaring a function
    # here while the consuming repo also pins it creates two Function resources
    # for one package, which makes Crossplane's dependency graph fail to
    # initialise and takes every Configuration unhealthy. Adopters outside that
    # repo must install function-environment-configs themselves.
