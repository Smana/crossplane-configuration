apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-configuration-gcp
  annotations:
    meta.crossplane.io/maintainer: Smana <smaine.kahlouch@ogenki.io>
    meta.crossplane.io/source: github.com/Smana/crossplane-configuration
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      GCP implementations of the ogenki platform APIs: the GCPWorkloadIdentity
      contract and Composition, the GCP App Composition (GCS buckets with
      bucket-scoped workload identity), and a placeholder SQLInstance
      Composition that fails explicitly until CNPG lands on GCP.
spec:
  crossplane:
    version: ">=v2.0.0-0"
  dependsOn:
    # The cloud-neutral contracts, same as the aws package depends on them.
    - configuration: ghcr.io/smana/crossplane-configuration-core
      version: ">=v0.1.0"
    # Every function the Composition's pipeline names is declared HERE, not
    # inherited. function-kcl and function-auto-ready reach a cluster through
    # -core's own dependsOn today, so this resolves either way — but relying on
    # that makes a change to -core's dependencies break GCP silently, and makes
    # this package's requirements unreadable from its own manifest.
    - function: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
      version: ">=v0.7.2"
    - function: xpkg.upbound.io/crossplane-contrib/function-kcl
      version: ">=v0.12.1"
    - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      version: ">=v0.7.0"
