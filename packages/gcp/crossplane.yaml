apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-configuration-gcp
  annotations:
    meta.crossplane.io/maintainer: Smana <smaine.kahlouch@ogenki.io>
    meta.crossplane.io/source: github.com/Smana/crossplane-configuration
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      GCP implementations of the ogenki platform APIs:
        - GCPWorkloadIdentity, the contract and its Composition.
        - App, with GCS buckets and bucket-scoped workload identity.
        - SQLInstance, CloudNativePG with barman backups to Cloud Storage,
          authenticated by Workload Identity rather than a service-account key.
        - InferenceService, whose serving pods get a per-claim read-only
          identity on the model-weights bucket -- Cloud Storage FUSE
          authenticates as the mounting pod, not at the CSI controller as EFS
          does on AWS.
spec:
  crossplane:
    version: ">=v2.0.0-0"
  dependsOn:
    # The cloud-neutral contracts, same as the aws package depends on them, and
    # the floor moves for the same reasons — see the fuller note there. Raised
    # to v0.3.0 for objectStore, then to v0.6.1 for `externalSecrets[].store`,
    # which this package's App Composition reads and only core v0.6.1's XRD
    # declares. A stale floor here fails silently: core is left at whatever
    # already satisfied it, and every claim is rejected on dry-run for a field
    # the cluster's XRD has never heard of.
    - configuration: ghcr.io/smana/crossplane-configuration-core
      version: ">=v0.6.1"
    # The function dependsOn entries that used to live here are removed
    # deliberately. See Smana/cloud-native-ref#1971 and the longer note in
    # packages/core/crossplane.yaml.
    #
    # This package previously declared all three functions explicitly, on the
    # reasoning that inheriting them through -core made GCP's requirements
    # unreadable from its own manifest. That reasoning was sound, and it is
    # exactly what makes the duplication worse here: three declared functions,
    # three chances for the consuming repo's pinned Function to collide with a
    # Crossplane-created one, three ways to wedge the dependency graph.
    #
    # The functions a Composition's pipeline names are now documented in the
    # README rather than declared as dependencies, so the requirement is still
    # readable without being installable twice.
