version: "3"

vars:
  # Enumerated from disk, not hardcoded. A hardcoded list means a new API or
  # package is silently skipped by whichever site forgot it — which has already
  # happened twice in this repo: an example went unrendered upstream, and
  # gcpworkloadidentity shipped with no generator-test coverage. render_check.py
  # and validate-schemas.sh already glob; these now match.
  APIS:
    sh: ls apis | tr '\n' ' '
  PKGS:
    sh: ls packages | tr '\n' ' '
  # v-prefixed to match the git tag, the OCI tag crossplane expects, and the
  # `>=v0.1.0` constraints in packages/*/crossplane.yaml. The release workflow
  # passes the git tag through verbatim.
  VERSION: '{{.VERSION | default "v0.1.0"}}'
  REGISTRY: '{{.REGISTRY | default "ghcr.io/smana"}}'

tasks:
  default:
    cmds:
      - task: check

  check:
    desc: Every gate CI runs — generate-sync, kcl fmt/test, XRD schema, render equivalence
    cmds:
      - task: generate-sync
      - task: test
      - task: schema
      - task: render

  generate:
    desc: Inline each KCL module into its composition.yaml
    cmds:
      - python3 scripts/generate.py

  generate-sync:
    desc: Fail if a composition.yaml is stale relative to its main.k
    cmds:
      - task: generate
      - cmd: |
          git diff --exit-code -- apis/ \
            || { echo "ERROR: composition.yaml is stale. Run 'task generate' and commit."; exit 1; }
        silent: true

  # `kcl fmt` has no --check flag (0.11.3), so format in place and require the tree
  # to be unchanged. A dirty diff here means someone committed unformatted KCL.
  test:
    desc: kcl fmt (via diff) and kcl test, per API
    cmds:
      - for: { var: APIS }
        cmd: |
          echo "==> {{.ITEM}}"
          cd apis/{{.ITEM}}/kcl
          kcl fmt . >/dev/null
          git diff --quiet -- . || {
            echo "ERROR: apis/{{.ITEM}}/kcl is not kcl-fmt clean. Commit the reformat."
            git diff --stat -- .
            exit 1
          }
          kcl test . -Y settings-example.yaml
          # APIs with a second mode test it too (sqlinstance: generated credentials).
          for s in settings-generated*.yaml; do
            [ -e "$s" ] || continue
            kcl test . -Y "$s"
          done
          # A claim the module must refuse: the render has to fail, and with the
          # message on the file's `# expect:` line, not with an unrelated error.
          for s in settings-reject-*.yaml; do
            [ -e "$s" ] || continue
            want=$(sed -n 's/^# expect: //p' "$s")
            [ -n "$want" ] || { echo "ERROR: $s has no '# expect:' line"; exit 1; }
            if out=$(kcl run main.k -Y "$s" 2>&1); then
              echo "ERROR: $s rendered; the module must refuse it ($want)"
              exit 1
            fi
            echo "$out" | grep -qF -- "$want" || {
              echo "ERROR: $s failed, but not with: $want"
              echo "$out" | tail -5
              exit 1
            }
            echo "REJECTED $s"
          done

  schema:
    desc: Validate every example claim against the shipped XRDs
    cmds:
      - ./scripts/validate-schemas.sh

  render:
    desc: Render every example and diff against tests/golden/
    cmds:
      - python3 scripts/render_check.py

  build:
    desc: Produce every .xpkg file
    cmds:
      - task: generate
      - ./scripts/assemble.sh
      - for: { var: PKGS }
        cmd: |
          crossplane xpkg build \
            --package-root=build/{{.ITEM}} \
            --examples-root=build/{{.ITEM}}/examples \
            --package-file=build/crossplane-configuration-{{.ITEM}}.xpkg

  # The release asset consumers pin. cloud-native-ref's gen-catalog.sh reads it via
  # XRD_CRDS_FILE, so one version string drives both the installed Configuration
  # and the schemas its claims are validated against.
  #
  # Uses the same converter `task schema` runs, so the published artifact cannot
  # diverge from the one CI validated the examples against.
  crds:
    desc: Build the xrd-crds.yaml release asset
    cmds:
      - mkdir -p build
      - python3 scripts/xrd-to-crd.py apis/*/definition.yaml > build/xrd-crds.yaml
      - cmd: |
          echo "wrote build/xrd-crds.yaml ($(grep -c '^kind: CustomResourceDefinition' build/xrd-crds.yaml) CRDs)"
        silent: true

  push:
    desc: Push every package to the registry (VERSION=vX.Y.Z)
    cmds:
      - for: { var: PKGS }
        cmd: |
          crossplane xpkg push \
            -f build/crossplane-configuration-{{.ITEM}}.xpkg \
            {{.REGISTRY}}/crossplane-configuration-{{.ITEM}}:{{.VERSION}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build/
