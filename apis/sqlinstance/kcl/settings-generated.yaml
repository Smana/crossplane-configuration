# The same composition, generated-credentials mode: roles that own no database,
# and no ClusterSecretStore anywhere (cloud-native-ref SP2 plan, ruling P7).
kcl_options:
  - key: params
    value:
      ctx:
        "apiextensions.crossplane.io/environment":
          "clusterName": "mycluster-0"
          region: "eu-west-3"
          cloud: "aws"
      oxr:
        metadata:
          name: "xplane-rooms"
          namespace: "agent-system"
          uid: "b2c3d4e5-6f70-8901-bcde-f12345678901"
        spec:
          instances: 1
          size: "small"
          storageSize: 20Gi
          postgresVersion: "18"
          credentials:
            source: generated
          databases:
            - name: rooms
              owner: rooms_owner
          roles:
            - name: rooms_owner
              superuser: false
            - name: rooms_broker
              superuser: false
            - name: rooms_retention
              superuser: false
          backup:
            schedule: "0 0 2 * * *"
            bucketName: "eu-west-3-ogenki-cnpg-backups"
      ocds: {}
