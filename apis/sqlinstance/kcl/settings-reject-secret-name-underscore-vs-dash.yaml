# expect: duplicate secret names [xplane-rooms-cnpg-role-a-b]
# Roles `a_b` and `a-b` both own nothing and both map to <xr>-cnpg-role-a-b.
kcl_options:
  - key: params
    value:
      ctx:
        "apiextensions.crossplane.io/environment":
          "clusterName": "mycluster-0"
          region: "eu-west-3"
          cloud: "aws"
      oxr:
        metadata:
          name: "xplane-rooms"
          namespace: "agent-system"
          uid: "b2c3d4e5-6f70-8901-bcde-f12345678901"
        spec:
          instances: 1
          size: "small"
          credentials:
            source: generated
          roles:
            - name: a_b
              superuser: false
            - name: a-b
              superuser: false
      ocds: {}
