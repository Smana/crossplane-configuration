# Generated credentials with no database at all: every role owns nothing, so
# each role's uri falls back to the `postgres` database.
kcl_options:
  - key: params
    value:
      ctx:
        "apiextensions.crossplane.io/environment":
          "clusterName": "mycluster-0"
          region: "eu-west-3"
          cloud: "aws"
      oxr:
        metadata:
          name: "xplane-rooms"
          namespace: "agent-system"
          uid: "b2c3d4e5-6f70-8901-bcde-f12345678901"
        spec:
          instances: 1
          size: "small"
          storageSize: 20Gi
          postgresVersion: "18"
          credentials:
            source: generated
          roles:
            - name: rooms_broker
              superuser: false
            - name: rooms_retention
              superuser: false
      ocds: {}
