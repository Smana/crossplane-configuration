# expect: duplicate secret names [xplane-rooms-cnpg-role-foo]
# Role `foo` owns nothing (secret <xr>-cnpg-role-foo) and database `role-foo`
# gets <xr>-cnpg-role-foo too.
kcl_options:
  - key: params
    value:
      ctx:
        "apiextensions.crossplane.io/environment":
          "clusterName": "mycluster-0"
          region: "eu-west-3"
          cloud: "aws"
      oxr:
        metadata:
          name: "xplane-rooms"
          namespace: "agent-system"
          uid: "b2c3d4e5-6f70-8901-bcde-f12345678901"
        spec:
          instances: 1
          size: "small"
          credentials:
            source: generated
          databases:
            - name: role-foo
              owner: bar
          roles:
            - name: bar
              superuser: false
            - name: foo
              superuser: false
      ocds: {}
