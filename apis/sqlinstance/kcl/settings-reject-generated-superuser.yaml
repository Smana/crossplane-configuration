# expect: generated mode has no superuser
# The superuser secret only comes from the ClusterSecretStore, which generated
# mode exists to avoid.
kcl_options:
  - key: params
    value:
      ctx:
        "apiextensions.crossplane.io/environment":
          "clusterName": "mycluster-0"
          region: "eu-west-3"
          cloud: "aws"
      oxr:
        metadata:
          name: "xplane-rooms"
          namespace: "agent-system"
          uid: "b2c3d4e5-6f70-8901-bcde-f12345678901"
        spec:
          instances: 1
          size: "small"
          createSuperuser: true
          credentials:
            source: generated
          databases:
            - name: rooms
              owner: rooms_owner
          roles:
            - name: rooms_owner
              superuser: false
      ocds: {}
