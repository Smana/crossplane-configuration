apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: gcpworkloadidentities.cloud.ogenki.io
  labels:
    provider: gcp
spec:
  scope: Namespaced
  group: cloud.ogenki.io
  names:
    kind: GCPWorkloadIdentity
    plural: gcpworkloadidentities
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.startsWith('xplane-')"
              message: "GCPWorkloadIdentity name must be prefixed with 'xplane-' per platform convention"
          properties:
            spec:
              type: object
              properties:
                # NO `namespace` field, deliberately — the identity always binds a
                # ServiceAccount in the CLAIM'S OWN namespace, which the composition
                # reads from metadata.namespace.
                #
                # A settable namespace here would make the XR namespaced but not
                # namespace-CONFINED: a claim in one namespace could hand another
                # team's workload a cloud identity, silently, and even before that
                # ServiceAccount exists. The IAM Condition on the cluster's
                # Crossplane identity bounds WHICH ROLE may be granted, never TO
                # WHOM, so nothing downstream would catch it.
                #
                # Validating it with CEL is not an option: Kubernetes exposes only
                # `name` and `generateName` under `self.metadata`, so a rule
                # comparing against `self.metadata.namespace` fails to compile
                # ("undefined field 'namespace'"). Deriving it is stronger anyway —
                # it makes the cross-namespace case unrepresentable rather than
                # merely rejected.
                #
                # This deliberately diverges from EPI, which takes a namespace.
                # Every EPI claim in cloud-native-ref/security/base/epis/ sets it to
                # the claim's own namespace regardless.
                serviceAccount:
                  type: object
                  description: The Kubernetes ServiceAccount that receives the identity, in this claim's namespace. No annotation is added to it — GKE Workload Identity binds by subject, not by annotation.
                  properties:
                    name:
                      type: string
                      description: Name of the Kubernetes ServiceAccount. Its namespace is the claim's own.
                  required:
                    - name
                roles:
                  type: array
                  description: >-
                    Google IAM roles to grant, in the exact form GCP names them —
                    either a predefined role ("roles/dns.admin") or a PROJECT-level
                    custom role ("projects/<project>/roles/<role_id>").
                    Organization-level custom roles ("organizations/<id>/roles/<id>")
                    are deliberately NOT accepted: this platform has no org-level
                    governance and the design lists cross-organisation identity as a
                    non-goal. Widen the pattern below if that changes.
                    The cluster's Crossplane identity can only grant roles its own
                    IAM Condition allowlists, so a role outside that list fails at
                    the provider with a message naming it.
                  minItems: 1
                  # The project segment accepts an ID (6-30 chars, GCP's real
                  # range) or a bare project NUMBER — GCP addresses the same
                  # project either way, and rejecting the numeric form would be a
                  # wrong rejection rather than a policy.
                  items:
                    type: string
                    pattern: '^(roles/[A-Za-z0-9_.]+|projects/([a-z][a-z0-9-]{4,28}[a-z0-9]|[0-9]{1,20})/roles/[A-Za-z0-9_.]+)$'
                projectID:
                  type: string
                  description: Google project to bind in. Defaults to the projectID from the gke-environment EnvironmentConfig.
                managementPolicies:
                  description: The management policy for the generated bindings.
                  type: array
                  items:
                    type: string
                    enum:
                      - "Delete"
                      - "Create"
                      - "Update"
                      - "LateInitialize"
                      - "Observe"
                providerConfigRef:
                  type: object
                  description: ProviderConfig Reference (use a ClusterProviderConfig "default" if not specified)
                  properties:
                    kind:
                      description: The kind of the referenced object.
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ClusterProviderConfig
                    name:
                      description: The name of the referenced object.
                      type: string
              required:
                - serviceAccount
                - roles
            # No `deletionPolicy` and no `status.member`, though EPI declares the
            # equivalents. Nothing in the composition writes either — it is
            # `target: Resources` with no status step — so both would ship inert
            # in a brand-new v1alpha1 and read as functional. Surfacing the
            # principal:// string in status would be genuinely useful for
            # debugging; it needs a status-writing step first, and can be added
            # then.
            status:
              type: object
              properties:
                observed:
                  description: Freeform field containing information about the observed status.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
