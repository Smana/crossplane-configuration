apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-database-cnpg-cluster
  labels:
    crossplane.io/composite: production-database
  name: production-database-cnpg-cluster
  namespace: production
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: SQLInstance
    name: production-database
    uid: ""
spec:
  bootstrap:
    initdb:
      database: myapp
      owner: myapp-user
      postInitApplicationSQLRefs:
        configMapRefs:
        - key: init.sql
          name: production-database-cnpg-bootsrapsql
      secret:
        name: production-database-cnpg-myapp
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  instances: 3
  managed:
    roles:
    - comment: Application database user
      inRoles:
      - pg_monitor
      login: true
      name: myapp-user
      passwordSecret:
        name: production-database-cnpg-myapp
      superuser: false
    - comment: Read-only user for analytics queries
      inRoles:
      - pg_read_all_data
      login: true
      name: analytics-user
      passwordSecret:
        name: production-database-cnpg-analytics
      superuser: false
  monitoring:
    customQueriesConfigMap:
    - key: queries
      name: production-database-cnpg-monitoring
    disableDefaultQueries: false
    enablePodMonitor: true
  plugins:
  - isWALArchiver: true
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: production-database-cnpg-objectstore
  postgresql:
    parameters:
      auto_explain.log_analyze: "on"
      auto_explain.log_buffers: "on"
      auto_explain.log_format: json
      auto_explain.log_min_duration: "1000"
      auto_explain.log_nested_statements: "on"
      auto_explain.log_timing: "off"
      auto_explain.log_triggers: "on"
      auto_explain.log_verbose: "on"
      auto_explain.sample_rate: "0.2"
      checkpoint_completion_target: "0.9"
      compute_query_id: "on"
      effective_cache_size: 2GB
      effective_io_concurrency: "200"
      log_connections: "on"
      log_disconnections: "on"
      log_line_prefix: '%m [%p] %u@%d '
      log_min_duration_statement: "1000"
      log_statement: none
      maintenance_work_mem: 256MB
      max_connections: "200"
      pg_stat_statements.max: "10000"
      pg_stat_statements.save: "on"
      pg_stat_statements.track: all
      pg_stat_statements.track_planning: "on"
      pg_stat_statements.track_utility: "on"
      random_page_cost: "1.1"
      shared_buffers: 512MB
      shared_preload_libraries: pg_stat_statements
      track_activity_query_size: "2048"
      track_io_timing: "on"
      wal_buffers: 16MB
      work_mem: 16MB
    pg_hba:
    - host all all 0.0.0.0/0 md5
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: "2"
      memory: 3Gi
    requests:
      cpu: "1"
      memory: 3Gi
  storage:
    size: 100Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    crossplane.io/composition-resource-name: production-database-cnpg-daily-backup
