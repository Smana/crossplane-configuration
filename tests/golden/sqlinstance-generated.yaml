    initdb:
      database: rooms
      owner: rooms_owner
      secret:
        name: xplane-rooms-cnpg-rooms
  imageName: ghcr.io/cloudnative-pg/postgresql:18-system-trixie
  instances: 1
  managed:
    roles:
    - comment: Owns the schema; Atlas migrates as it
      login: true
      name: rooms_owner
      passwordSecret:
        name: xplane-rooms-cnpg-rooms
      superuser: false
    - comment: Appends to and reads the log, nothing else
      login: true
      name: rooms_broker
      passwordSecret:
        name: xplane-rooms-cnpg-role-rooms-broker
      superuser: false
    - comment: Deletes rooms closed past their retention
      login: true
      name: rooms_retention
      passwordSecret:
        name: xplane-rooms-cnpg-role-rooms-retention
      superuser: false
  monitoring:
    enablePodMonitor: true
  plugins:
  - isWALArchiver: true
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: xplane-rooms-cnpg-objectstore
      serverName: xplane-rooms-cnpg-cluster-b2c3d4e5
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 1Gi
  storage:
    size: 20Gi
