apiVersion: cloud.ogenki.io/v1alpha1
kind: KVStore
metadata:
  annotations:
    crossplane.io/composition-resource-name: xplane-image-gallery-kvstore
  labels:
    crossplane.io/composite: image-gallery
  name: xplane-image-gallery
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: image-gallery
    uid: ""
spec:
  size: small
---
apiVersion: cloud.ogenki.io/v1alpha1
kind: EPI
metadata:
  annotations:
    crossplane.io/composition-resource-name: xplane-image-gallery-s3-pod-identity
  labels:
    crossplane.io/composite: image-gallery
  name: xplane-image-gallery-s3-pod-identity
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: image-gallery
    uid: ""
spec:
  clusters:
  - name: mycluster-0
    region: eu-west-3
  policyDocument: |-
    {
            "Version": "2012-10-17",
            "Statement": [
                {
                    "Effect": "Allow",
                    "Action": [
                        "s3:ListBucket"
                    ],
                    "Resource": "arn:aws:s3:::eu-west-3-ogenki-image-gallery"
                },
                {
                    "Effect": "Allow",
                    "Action": [
                        "s3:GetObject",
                        "s3:PutObject",
                        "s3:DeleteObject"
                    ],
                    "Resource": "arn:aws:s3:::eu-west-3-ogenki-image-gallery/*"
                }
            ]
        }
  serviceAccount:
    name: image-gallery
    namespace: demo
---
apiVersion: cloud.ogenki.io/v1alpha1
kind: SQLInstance
metadata:
  annotations:
    crossplane.io/composition-resource-name: xplane-image-gallery-sqlinstance
  labels:
    crossplane.io/composite: image-gallery
  name: xplane-image-gallery
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: image-gallery
    uid: ""
spec:
  atlasSchema:
    path: internal/platform/database/migrations
    ref: main
    url: https://github.com/Smana/image-gallery.git
  backup:
    bucketName: image-gallery-db-backups
    retentionPolicy: 30d
    schedule: 0 2 * * *
  databases:
  - name: image-gallery
    owner: image-gallery-app
  instances: 2
  postgresql:
    parameters:
      max_connections: 100
      shared_buffers: 256MB
    pg_hba:
    - host all all 0.0.0.0/0 md5
  primaryUpdateStrategy: unsupervised
  roles:
  - comment: Application user for image-gallery
    inRoles:
    - pg_monitor
    name: image-gallery-app
    superuser: false
  size: small
  storageSize: 20Gi
