        type: PathPrefix
        value: /
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  annotations:
    crossplane.io/composition-resource-name: image-gallery-pdb
  labels:
    crossplane.io/composite: image-gallery
  name: image-gallery
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: image-gallery
    uid: ""
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: image-gallery
      app.kubernetes.io/name: image-gallery
  unhealthyPodEvictionPolicy: AlwaysAllow
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    crossplane.io/composition-resource-name: image-gallery-pvc
  labels:
    app.kubernetes.io/instance: image-gallery
    app.kubernetes.io/name: image-gallery
    crossplane.io/composite: image-gallery
  name: image-gallery-data
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: image-gallery
    uid: ""
