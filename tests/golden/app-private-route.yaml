---
apiVersion: cloud.ogenki.io/v1alpha1
kind: App
metadata:
  name: private-app
  namespace: demo
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: private-app-deployment, private-app-httproute, private-app-service,
      and 1 more'
    reason: Creating
    status: "False"
    type: Ready
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    crossplane.io/composition-resource-name: private-app-deployment
  labels:
    app.kubernetes.io/instance: private-app
    app.kubernetes.io/name: private-app
    crossplane.io/composite: private-app
  name: private-app
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: private-app
    uid: ""
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: private-app
      app.kubernetes.io/name: private-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: private-app
        app.kubernetes.io/name: private-app
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: USER
          value: app
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: ghcr.io/example/private-app:v1.0.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        name: private-app
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: private-app
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    crossplane.io/composition-resource-name: private-app-httproute
  labels:
    crossplane.io/composite: private-app
  name: private-app
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: private-app
    uid: ""
spec:
  hostnames:
  - private-app.priv.aws.ogenki.io
  parentRefs:
  - name: platform-tailscale-general
    namespace: infrastructure
  rules:
  - backendRefs:
    - name: private-app
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    crossplane.io/composition-resource-name: private-app-service
  labels:
    app.kubernetes.io/instance: private-app
    app.kubernetes.io/name: private-app
    crossplane.io/composite: private-app
  name: private-app
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: private-app
    uid: ""
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: private-app
    app.kubernetes.io/name: private-app
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    crossplane.io/composition-resource-name: private-app-serviceaccount
  labels:
    crossplane.io/composite: private-app
  name: private-app
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: private-app
    uid: ""
