---
apiVersion: cloud.ogenki.io/v1alpha1
kind: App
metadata:
  name: nightly-cleanup
  namespace: demo
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: nightly-cleanup-serviceaccount'
    reason: Creating
    status: "False"
    type: Ready
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    crossplane.io/composition-resource-name: nightly-cleanup-cronjob
  labels:
    app.kubernetes.io/instance: nightly-cleanup
    app.kubernetes.io/name: nightly-cleanup
    crossplane.io/composite: nightly-cleanup
  name: nightly-cleanup
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: nightly-cleanup
    uid: ""
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: nightly-cleanup
            app.kubernetes.io/name: nightly-cleanup
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - --older-than
            - 30d
            command:
            - ./cleanup
            env:
            - name: USER
              value: app
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LOG_LEVEL
              value: info
            image: ghcr.io/example/maintenance:v2.0.1
            imagePullPolicy: IfNotPresent
            name: nightly-cleanup
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: nightly-cleanup
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    crossplane.io/composition-resource-name: nightly-cleanup-serviceaccount
  labels:
    crossplane.io/composite: nightly-cleanup
  name: nightly-cleanup
  namespace: demo
  ownerReferences:
  - apiVersion: cloud.ogenki.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: nightly-cleanup
    uid: ""
